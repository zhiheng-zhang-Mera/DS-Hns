<!doctype html>
<!--
  Login form.

  Submitting with both required fields filled shows the role="status" node with
  the text "Saved" and clears the password. Submitting with a missing required
  field shows the role="alert" node naming the first empty field instead. Both
  branches are device script (see tests/helpers/computer-use-device.cjs).
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
</head>
<body style="background:#ffffff">
  <h1 id="heading">Sign in</h1>
  <form
    id="login"
    action="/session"
    method="post"
    data-cu-on-valid="hide #error; show #status; text #status Saved; value #password &quot;&quot;"
    data-cu-on-invalid="hide #status; show #error; text #error {field} is required">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required placeholder="username" style="width:200px">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required style="width:200px">
    </div>
    <div class="field">
      <label for="remember"><input id="remember" name="remember" type="checkbox"> Remember me</label>
    </div>
    <button id="sign-in" type="submit">Sign in</button>
  </form>
  <p id="status" role="status" hidden></p>
  <p id="error" role="alert" hidden></p>
</body>
</html>
