<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; media-src file:;"></head>
<body><audio id="audio"></audio><script>
const audio = document.getElementById('audio');
window.megaPlayer.onPlay(({src, volume}) => { audio.pause(); audio.src = src; audio.volume = Math.max(0, Math.min(1, Number(volume) || 0)); audio.currentTime = 0; audio.play().catch(() => {}); });
</script></body></html>
