<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Mega Extensions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><h1>Mega Extensions</h1><p>Alien 主体上的可选功能层 · 不接触官方 dsh renderer</p></div>
    <div class="actions"><button id="openMain">返回官方 Harness</button><button id="refresh">刷新</button></div>
  </header>
  <main>
    <section class="cards" id="summary"></section>

    <section class="panel">
      <h2>任务队列</h2>
      <form id="taskForm" class="grid-form">
        <textarea id="prompt" required placeholder="输入要交给 headless dsh 的任务"></textarea>
        <label>开始时间 <input id="startAt" type="datetime-local"></label>
        <label><input id="allowPeak" type="checkbox"> 允许峰值时段运行</label>
        <label>权限 <select id="permission"><option value="">跟随全局</option><option value="workspace-write">workspace-write</option><option value="read-only">read-only</option><option value="danger-full-access">danger-full-access</option></select></label>
        <button type="submit">加入队列</button>
        <button type="button" id="clearPending">清空待运行</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>状态</th><th>任务</th><th>峰值</th><th>开始</th><th>操作</th></tr></thead><tbody id="tasks"></tbody></table></div>
    </section>

    <section class="split">
      <div class="panel">
        <h2>调度设置</h2>
        <form id="schedulerForm" class="stack">
          <label>最小并发 <input id="minConcurrent" type="number" min="1" max="64"></label>
          <label>最大并发 <input id="maxConcurrent" type="number" min="1" max="64"></label>
          <label><input id="defaultAllowPeak" type="checkbox"> 新任务默认允许峰值</label>
          <label><input id="interruptRunningAtPeak" type="checkbox"> 峰值到来时中断 off-peak-only 任务</label>
          <button>保存调度设置</button>
        </form>
      </div>
      <div class="panel">
        <h2>Harness / 提醒</h2>
        <form id="settingsForm" class="stack">
          <label>默认模型 <select id="model"></select></label>
          <label>权限模式 <select id="globalPermission"><option value="workspace-write">workspace-write</option><option value="read-only">read-only</option><option value="danger-full-access">danger-full-access</option></select></label>
          <label>遥测 <select id="telemetry"><option value="DISABLED">DISABLED</option><option value="ENABLED">ENABLED</option></select></label>
          <label>API Key（留空不修改） <input id="apiKey" type="password" autocomplete="off"></label>
          <label><input id="soundEnabled" type="checkbox"> 启用任务提示音</label>
          <label>音量 <input id="volume" type="range" min="0" max="1" step="0.05"></label>
          <button>保存设置</button>
        </form>
        <div class="row"><button id="workspace">选择队列工作区</button><button id="soundFile">导入提示音</button><button id="balance">刷新余额</button></div>
        <p class="muted" id="workspaceText"></p><pre id="balanceText"></pre>
      </div>
    </section>

    <section class="panel">
      <h2>最近 Session</h2>
      <div class="table-wrap"><table><thead><tr><th>状态</th><th>模型</th><th>Token</th><th>成本</th><th>时间</th></tr></thead><tbody id="sessions"></tbody></table></div>
    </section>
    <p id="error" class="error"></p>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
