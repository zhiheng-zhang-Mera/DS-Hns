<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'"
    />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="side-head">
        <div class="side-top">
          <button id="sideToggle" class="side-toggle" type="button" title="收起/展开历史侧栏">«</button>
          <div class="brand-mini"><span class="dot pulse"></span> DeepSeek Harness</div>
        </div>
        <button id="newChatBtn" class="new-btn" type="button">＋ 新任务</button>
      </div>
      <nav id="navTabs" class="nav-tabs">
        <button class="nav-tab active" data-view="tasks" type="button">任务</button>
        <button class="nav-tab" data-view="queue" type="button">排队</button>
      </nav>
      <div id="threadList" class="thread-list"></div>
      <div class="side-foot">
        <a id="settingsBtnSide" class="ghost" href="/settings.html">⚙ 设置</a>
        <a id="monitorBtnSide" class="ghost" href="/">▣ 监控视图</a>
      </div>
    </aside>

    <section id="chatColumn">
      <header id="chatHeader">
        <div class="head-status">
          <span id="periodBadge" class="badge" title="峰谷状态(悬停看详情)">—</span>
          <span id="modelLabel" class="model-label">deepseek-v4-flash</span>
          <span id="threadState" class="muted"></span>
        </div>
        <div class="head-actions">
          <button id="popQueueBtn" class="icon-btn" type="button" data-pop="queue" title="定时队列(悬停看概要)">⏱<em>队列</em></button>
          <button id="popBalBtn" class="icon-btn" type="button" data-pop="balance" title="账户余额(悬停看概要)">¥<em>余额</em></button>
          <button id="soundBtnChat" class="ghost" type="button" data-pop="sound" title="铃声开关/设置">铃声:开</button>
          <a id="monitorBtn" class="ghost" href="/">监控视图</a>
          <a id="settingsBtn" class="ghost" href="/settings.html">设置</a>
        </div>
      </header>

      <main id="chatMessages">
        <div id="emptyState" class="empty">
          <h2>DeepSeek Harness</h2>
          <p>像 Codex / ChatGPT 桌面版一样发送任务。默认谷价时段自动开始;也可以立即运行或定时排队。</p>
        </div>
      </main>

      <form id="chatForm" class="composer">
        <textarea
          id="chatComposer"
          rows="1"
          placeholder="描述任务… 例如: 检查项目目录并运行测试"
        ></textarea>
        <div id="attachChips" class="attach-chips" hidden></div>
        <div class="composer-tools">
          <label class="chip"><input id="chatFiles" type="file" multiple hidden />📎 附件</label>
          <label class="chip perm-chip">权限
            <select id="chatPerm" title="本次任务的工作区访问权限">
              <option value="workspace-write">工作区内修改</option>
              <option value="danger-full-access">完全权限</option>
              <option value="read-only">仅可查看</option>
            </select>
          </label>
          <label class="chip"><input id="chatAllowPeak" type="checkbox" /> 立即运行(允许高峰)</label>
          <label class="chip date-chip">定时<input id="chatStartAt" type="datetime-local" /></label>
          <span id="composerHint" class="muted small"></span>
          <button id="sendBtn" class="send-btn" type="submit" title="发送任务">↑</button>
        </div>
      </form>

      <!-- 对话框下常驻的参考数据(以官方 dsh 用量口径补充:输入/输出/缓存读写/推理/命中率/成本) -->
      <div id="usageStrip" class="usage-strip" title="最近任务用量实时参考">
        <span class="us-item us-state"><b id="uState" class="badge">IDLE</b></span>
        <span class="us-item">模型 <b id="uModel">—</b></span>
        <span class="us-item">输入 <b id="uIn">0</b></span>
        <span class="us-item">输出 <b id="uOut">0</b></span>
        <span class="us-item">缓存命中 <b id="uCache">0</b></span>
        <span class="us-item">缓存写 <b id="uWrite">0</b></span>
        <span class="us-item">推理 <b id="uReason">0</b></span>
        <span class="us-item">命中率 <b id="uHit">—</b></span>
        <span class="us-item">成本 ¥ <b id="uCost">—</b></span>
        <span class="us-item us-sus" id="usSusWrap" hidden>挂起 <b id="uSusReason">—</b></span>
        <span class="us-item us-sus" id="usAtWrap" hidden>启动 <b id="uSusAt">—</b></span>
        <span class="us-item us-hint muted" id="uHint">选择左侧任务查看明细;任务结束时响铃</span>
      </div>
    </section>

    <div id="batchBar" class="batch-bar" hidden>
      <span id="batchInfo" class="muted">已选 0 项</span>
      <button id="batchSelAll" class="btn mini-btn" type="button">全选</button>
      <button id="batchMove" class="btn mini-btn" type="button">移动到文件夹…</button>
      <button id="batchDelete" class="btn mini-btn danger" type="button">删除所选</button>
      <button id="batchCancel" class="btn mini-btn" type="button">完成</button>
    </div>
    <div id="threadCtx" class="thread-ctx" hidden></div>
    <div id="modalMask" class="modal-mask" hidden><div class="modal" id="modalBox"></div></div>
    <div id="hoverPop" class="hover-pop" hidden></div>
    <div id="toastWrap"></div>
    <script src="/ds-sound.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
