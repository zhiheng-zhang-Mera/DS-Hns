<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'"
    />
    <title>DS-Harness · 设置</title>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body class="settings-page">
    <header id="chatHeader" class="view-header">
      <nav class="view-nav">
        <a href="/chat.html">◀ 对话</a>
        <a href="/">监控</a>
        <span class="active">设置</span>
      </nav>
      <div class="head-status">
        <span id="periodBadge" class="badge">—</span>
        <span class="model-label">DS-Harness 设置</span>
      </div>
    </header>

    <main class="settings-main">
      <h1>设置</h1>
      <p class="muted">保存即时生效。Key 只回显掩码,项目数据仍全部位于本机工程目录(默认 D 盘)。</p>

      <section class="settings-card">
        <h2>API</h2>
        <label>DeepSeek API Key
          <input id="setApiKey" type="password" autocomplete="off" placeholder="sk-…" />
        </label>
        <p id="apiKeyState" class="muted"></p>
        <label class="check-line"><input id="setClearKey" type="checkbox" /> 清除已保存的 Key</label>
      </section>

      <section class="settings-card">
        <h2>运行策略</h2>
        <div class="form-grid">
          <label>默认模型
            <select id="setModel"></select>
          </label>
          <label>权限模式
            <select id="setPermission">
              <option value="workspace-write">workspace-write(默认)</option>
              <option value="danger-full-access">danger-full-access</option>
            </select>
          </label>
          <label>遥测
            <select id="setTelemetry">
              <option value="DISABLED">DISABLED</option>
              <option value="FEEDBACK_ONLY">FEEDBACK_ONLY</option>
              <option value="FULL">FULL</option>
            </select>
          </label>
          <label>最小并发
            <input id="setMin" type="number" min="1" max="32" />
          </label>
          <label>最大并发
            <input id="setMax" type="number" min="1" max="64" />
          </label>
        </div>
        <label class="check-line"><input id="setPeakPause" type="checkbox" /> 高峰时暂停运行中的谷价任务并谷价自动重排</label>
      </section>

      <section class="settings-card">
        <h2>铃声 (Ringtone)</h2>
        <p class="muted">
          完成 / 失败 / 中断三类事件各自可开关、可选用内置预设或你上传的本地音频(wav/mp3)。
          总开关控制全部铃声;所有修改点“保存设置”后立即生效并写入 config\sound.json。
          桌面版由隐藏音频宿主播放,浏览器模式由页面直接播放——dsh 执行永不被铃声失败阻塞。
        </p>
        <label class="check-line"><input id="setSound" type="checkbox" /> 启用铃声(总开关)</label>
        <label>播放音量
          <div class="vol-row">
            <input id="setVolume" type="range" min="0" max="100" step="5" value="80" />
            <span id="volLabel" class="vol-label">80%</span>
          </div>
        </label>
        <div id="soundEvents" class="sound-events"></div>
      </section>

      <div class="settings-actions">
        <button id="settingsSave" class="btn primary" type="button">保存设置</button>
        <a id="settingsBack" class="btn ghost-btn" href="/chat.html">返回对话</a>
      </div>
      <p id="settingsMsg" class="muted"></p>

      <details class="settings-card">
        <summary>路径(只读)</summary>
        <div id="pathTable" class="path-table"></div>
      </details>
    </main>
    <div id="toastWrap"></div>
    <script src="/ds-sound.js"></script>
    <script src="/settings.js"></script>
  </body>
</html>
