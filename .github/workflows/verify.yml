name: verify

# Syntax, unit and architecture gates.
#
# This runs on Windows because DS-Hns is a Windows desktop product: the tests
# exercise the real launcher/installer scripts, the `.cmd` shims, `taskkill.exe`
# teardown and PowerShell probes, and a green Linux run would not be evidence that
# the shipped platform works. The full Electron acceptance is a release step on
# top of this (scripts\acceptance.mjs, see its header for usage).
on:
  push:
    branches: [main, merging]
  pull_request:
    branches: [main, merging]

jobs:
  verify:
    name: check + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax gate
        working-directory: app
        run: npm run check

      - name: Unit + architecture tests
        working-directory: app
        run: npm test
