name: verify

# Syntax, unit and architecture gates.
#
# This runs on Windows because DS-Hns is a Windows desktop product: the tests
# exercise the real launcher/installer scripts, the `.cmd` shims, `taskkill.exe`
# teardown and PowerShell probes, and a green Linux run would not be evidence that
# the shipped platform works. The full Electron acceptance is a release step on
# top of this (scripts\acceptance.mjs, see its header for usage).
on:
  push:
    branches: [main, merging, Theme-Cover, computer-use]
  pull_request:
    branches: [main, merging, Theme-Cover, computer-use]

jobs:
  verify:
    name: check + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned on purpose. The suite is verified on both 22 and 24 locally,
          # and pinning the LTS line is what keeps the gate reproducible: the
          # `node --test` runner resolves "the event loop emptied" differently on
          # the version boundary, which is exactly the class of failure this gate
          # is supposed to surface rather than hide behind a floating version.
          node-version: '22'

      - name: Syntax gate
        working-directory: app
        run: npm run check

      - name: Unit + architecture tests
        working-directory: app
        run: npm test

      # The four-surface work (Update-Plan/General-Theme.md) adds modules in
      # subdirectories the syntax gate has to be told about explicitly, and two
      # HTML documents that are part of the product. A silent gap there would be a
      # green gate over unchecked code, so the directories are asserted here too.
      - name: Theme surface gate
        shell: pwsh
        run: |
          $required = @(
            'app/frontend-mode/state.cjs',
            'app/frontend-mode/model.cjs',
            'app/frontend-mode/backend.cjs',
            'app/frontend-mode/adapter.cjs',
            'app/frontend-mode/sync.cjs',
            'app/frontend-mode/manager.cjs',
            'app/frontend-mode/probe.cjs',
            'app/frontend-mode/index.cjs',
            'app/native-ui/index.html',
            'app/native-ui/preload.cjs',
            'app/native-ui/app.js',
            'app/native-ui/app.css',
            'app/native-ui/state/store.js',
            'app/native-ui/components/dom.js',
            'app/native-ui/components/topbar.js',
            'app/native-ui/components/context-panel.js',
            'app/native-ui/components/session-list.js',
            'app/native-ui/components/conversation.js',
            'app/native-ui/components/tool-activity.js',
            'app/native-ui/components/composer.js',
            'app/native-ui/components/settings.js',
            'app/native-ui/themes/base.css',
            'app/extensions/mega/theme/surface.js',
            'app/extensions/mega/theme/assets/planner.js',
            'app/extensions/mega/theme/assets/generator.js',
            'app/extensions/mega/theme/assets/processor.js',
            'app/extensions/mega/theme/assets/validator.js',
            'app/extensions/mega/theme/assets/fallback.js',
            'app/extensions/mega/theme/official/overlay-layout.js',
            'app/extensions/mega/theme/official/overlay-safety.js',
            'app/official-surface-views.cjs',
            'app/extensions/mega/ui/hns-shell.html',
            'app/extensions/mega/ui/official-overlay.html'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "missing theme surface files: $($missing -join ', ')"; exit 1 }
          $dirs = @(
            'extensions/mega/theme/assets',
            'extensions/mega/theme/official',
            'frontend-mode',
            'native-ui',
            'native-ui/components',
            'native-ui/state'
          )
          $check = Get-Content scripts/check-syntax.cjs -Raw
          foreach ($dir in $dirs) {
            if ($check -notmatch [regex]::Escape($dir)) { Write-Error "check-syntax.cjs does not cover $dir"; exit 1 }
          }
          Write-Host "theme + dual-UI surface files present and covered by the syntax gate"

      # Update-Plan/computer-use.md ships a runtime plus real Windows drivers and
      # a panel. The syntax gate has to be told about the new directories, so the
      # same silence-proof assertion is repeated here: a green gate over an
      # unchecked controller would be worse than a red one.
      - name: Computer Use surface gate
        shell: pwsh
        run: |
          $required = @(
            'app/computer-use/index.cjs',
            'app/computer-use/constants.cjs',
            'app/computer-use/errors.cjs',
            'app/computer-use/ports.cjs',
            'app/computer-use/contract.cjs',
            'app/computer-use/criteria.cjs',
            'app/computer-use/action.cjs',
            'app/computer-use/target.cjs',
            'app/computer-use/world-state.cjs',
            'app/computer-use/state-machine.cjs',
            'app/computer-use/safety.cjs',
            'app/computer-use/routing.cjs',
            'app/computer-use/log.cjs',
            'app/computer-use/stabilization.cjs',
            'app/computer-use/verification.cjs',
            'app/computer-use/miss.cjs',
            'app/computer-use/recovery.cjs',
            'app/computer-use/stall.cjs',
            'app/computer-use/observer.cjs',
            'app/computer-use/executor.cjs',
            'app/computer-use/isolation.cjs',
            'app/computer-use/autonomy.cjs',
            'app/computer-use/host-electron.cjs',
            'app/computer-use/controllers/browser.cjs',
            'app/computer-use/controllers/desktop.cjs',
            'app/computer-use/controllers/vision.cjs',
            'app/computer-use/controllers/shell.cjs',
            'app/computer-use/controllers/file.cjs',
            'app/computer-use/drivers/cdp-page.cjs',
            'app/computer-use/drivers/win32.cjs',
            'app/computer-use/drivers/win32-input.ps1',
            'app/computer-use/drivers/uia.cjs',
            'app/computer-use/drivers/uia.ps1',
            'app/computer-use/drivers/screenshot.cjs',
            'app/computer-use/drivers/screenshot.ps1',
            'app/extensions/mega/ui/computer-use-panel.js',
            'scripts/computer-use-acceptance.cjs',
            'docs/computer-use.md'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "missing computer use files: $($missing -join ', ')"; exit 1 }
          $dirs = @('computer-use', 'computer-use/controllers', 'computer-use/drivers')
          $check = Get-Content scripts/check-syntax.cjs -Raw
          foreach ($dir in $dirs) {
            if ($check -notmatch [regex]::Escape($dir)) { Write-Error "check-syntax.cjs does not cover $dir"; exit 1 }
          }
          $config = Get-Content config/app.json -Raw
          if ($config -notmatch '"computerUse"') { Write-Error 'config/app.json has no computerUse block'; exit 1 }
          $shell = Get-Content app/desktop-main.cjs -Raw
          if ($shell -notmatch 'COMPUTER_USE_CHANNELS') { Write-Error 'the shell does not register the Computer Use IPC surface'; exit 1 }
          Write-Host "computer use runtime, drivers, panel and acceptance harness present and covered by the syntax gate"
