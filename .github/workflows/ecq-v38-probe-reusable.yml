name: ecq-v38-owned-dynamic-consumer
on:
  workflow_call:
    inputs:
      shard:
        type: string
        required: true
      scenario:
        type: string
        required: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record inputs and exercise the required outcome
        env:
          SHARD: ${{ inputs.shard }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          printf 'shard=%s\n' "$SHARD"
          if [ "$SCENARIO" = required-failure ] && [ "$SHARD" = beta ]; then
            exit 1
          fi
