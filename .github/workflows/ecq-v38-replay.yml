name: ecq-v38-independent-replay
on:
  push:
    branches: [codex/ecq-v38]
    paths: [.github/workflows/ecq-v38-replay.yml, scripts/ecq-v38/**, tests/ecq-v38/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            scripts/ecq-v38
            tests/ecq-v38
            artifacts/paper-revision/ecq-v38/controls/development.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - run: npm ci --ignore-scripts --prefix scripts/ecq-v38/native
      - run: python -m pip install -r scripts/ecq-v38/reference/requirements.txt
      - run: node --test tests/ecq-v38/native/*.test.mjs
      - run: python -m unittest discover -s tests/ecq-v38/reference -v
      - run: python scripts/ecq-v38/study/run_controls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-${{ matrix.os }}
          path: |
            artifacts/paper-revision/ecq-v38/controls/*results.json
            artifacts/paper-revision/ecq-v38/controls/summary.json
          retention-days: 7
