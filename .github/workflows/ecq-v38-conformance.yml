name: ecq-v38-platform-conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record execution identity
        env:
          IDENTITY_JSON: >-
            {"workflowSha":"${{ github.workflow_sha }}","workflowRef":"${{ github.workflow_ref }}","sha":"${{ github.sha }}","repository":"${{ github.repository }}","runId":"${{ github.run_id }}","runAttempt":"${{ github.run_attempt }}","eventName":"${{ github.event_name }}"}
        run: printf '%s\n' "$IDENTITY_JSON" > identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expression-observations
          path: identity.json
          retention-days: 7
  matrix:
    name: Shard verification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [alpha, beta, gamma, delta]
    steps:
      - env:
          SHARD: ${{ matrix.shard }}
        run: printf '%s\n' "$SHARD"
  push-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo push-only
  aggregate:
    if: always()
    needs: [matrix, push-only]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check declared dependency results
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          OPTIONAL_RESULT: ${{ needs.push-only.result }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON" > needs.json
          test "$MATRIX_RESULT" = success
          test "$OPTIONAL_RESULT" = skipped
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: needs-observations
          path: needs.json
          retention-days: 7
