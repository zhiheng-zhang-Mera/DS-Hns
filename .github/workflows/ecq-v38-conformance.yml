name: ecq-v38-producer-evidence
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [normal, required-failure]
        required: true
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - id: emit
        env:
          SCENARIO: ${{ inputs.scenario }}
          IDENTITY: >-
            {"workflowSha":"${{ github.workflow_sha }}","workflowRef":"${{ github.workflow_ref }}","sha":"${{ github.sha }}","repository":"${{ github.repository }}","runId":"${{ github.run_id }}","runAttempt":"${{ github.run_attempt }}","eventName":"${{ github.event_name }}"}
        run: |
          case "$SCENARIO" in
            normal) matrix='{"shard":["alpha","beta"]}' ;;
            required-failure) matrix='{"shard":["alpha","beta","gamma"]}' ;;
            *) exit 2 ;;
          esac
          printf '%s\n' "$IDENTITY" > identity.json
          printf '%s\n' "$matrix" > producer-matrix.json
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: producer-evidence
          path: |
            identity.json
            producer-matrix.json
          retention-days: 7
  test:
    name: Dynamic ${{ matrix.shard }}
    needs: producer
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.producer.outputs.matrix) }}
    uses: ./.github/workflows/ecq-v38-probe-reusable.yml
    with:
      shard: ${{ matrix.shard }}
      scenario: ${{ inputs.scenario }}
